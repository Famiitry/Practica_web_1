version: '3.8'

services:
  # Base de datos PostgreSQL para el microservicio de autenticacion
  db:
    image: postgres:16-alpine
    container_name: postgres-veterinaria
    restart: always
    environment:
      POSTGRES_DB: veterinaria_auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Microservicio de Autenticacion (Spring Boot)
  auth-service:
    build: .
    container_name: auth-service-veterinaria
    restart: always
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://db:5432/veterinaria_auth_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    depends_on:
      - db

volumes:
  postgres_data:

